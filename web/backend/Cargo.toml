[package]
name = "telegram-drive-web"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-cors = "0.7"
actix-multipart = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
grammers-client = { version = "0.10", features = ["fs"] }
grammers-session = "0.10"
grammers-mtsender = "0.10"
grammers-tl-types = "0.10"
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.21"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
futures = "0.3"
async-stream = "0.3"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
mime_guess = "2"
tempfile = "3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
md5 = "0.8"
