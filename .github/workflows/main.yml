name: "Auto Release"
on:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (Standard x64)
          - platform: windows-latest
            args: ''
          
          # Linux (Ubuntu x64)
          - platform: ubuntu-22.04
            args: ''
            
          # macOS (Apple Silicon / ARM64)
          # macos-latest is already ARM64 - no explicit target needed
          - platform: macos-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets: Linux, Windows, and Mac ARM
          targets: aarch64-apple-darwin, x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: install frontend dependencies
        working-directory: app
        run: npm install

      - name: Get version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_DMG_IGNORE_CI: true
          # Apple signing disabled - produces unsigned app
          # To enable signing, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, 
          # and APPLE_SIGNING_IDENTITY secrets to your repository
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Telegram Drive v${{ steps.version.outputs.version }}'
          releaseBody: |
            ## What's New in v${{ steps.version.outputs.version }}
            
            ### 📥 Downloads
            - **Windows:** `Telegram Drive_${{ steps.version.outputs.version }}_x64-setup.exe`
            - **Linux:** `Telegram Drive_${{ steps.version.outputs.version }}_amd64.AppImage`
            - **macOS:** `Telegram Drive_${{ steps.version.outputs.version }}_aarch64.dmg`
            
            ### 🔧 Changes
            - Auto-built from latest commit on main branch
            
            ---
            Built with ❤️ using [Tauri](https://tauri.app/)
          releaseDraft: false
          prerelease: false
          projectPath: ./app
          args: ${{ matrix.args }}